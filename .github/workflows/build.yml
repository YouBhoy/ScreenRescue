name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/ScreenRescue.Core.Tests -c Release
      - run: dotnet build src/ScreenRescue -c Release
      - run: dotnet build tests/ScreenRescue.Windows.Tests -c Release
      - run: dotnet run --project tests/ScreenRescue.Windows.Tests -c Release --no-build -- --headless
      - run: dotnet publish src/ScreenRescue -c Release -r win-x64 --self-contained true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenRescue-win-x64
          path: publish/
